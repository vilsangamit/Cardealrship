</head>
<body>

    <div class="logo">

    </ul>

</nav>

<section class="featured" style="margin-top:100px;">

<h2>Our Cars</h2>

<input
type="text"
id="searchBox"
placeholder="Search by car name..."
style="width:300px;padding:12px;margin-bottom:30px;">

<div class="card-container" id="carContainer">

<div class="card">
<img src="images/car1.jpg">
<h3>BMW X5</h3>
<p>45,00,000</p>

<button class="details-btn">View Details</button>

</div>

<div class="card">
<img src="images/car2.jpg">
<h3>Audi A6</h3>
<p>38,00,000</p>

<button class="details-btn">View Details</button>

</div>

<div class="card">
<img src="images/car3.jpg">
<h3>Mercedes C-Class</h3>
<p>42,00,000</p>

<button class="details-btn">View Details</button>

</div>

<div class="card">
<img src="images/car4.jpg">
<h3>Toyota Fortuner</h3>
<p>35,00,000</p>

<button class="details-btn">View Details</button>

</div>

<div class="card">
<img src="images/car5.jpg">
<h3>Hyundai Creta</h3>
<p>22,00,000</p>

<button class="details-btn">View Details</button>

</div>

<div class="card">
<img src="images/car6.jpg">

<p>28,00,000</p>

</div>

</div>

</section>

<footer>

<div>

</div>

<div>
<a href="#">Facebook</a>
<a href="#">Instagram</a>
<a href="#">YouTube</a>
</div>

</footer>

<script>
const carContainer = document.getElementById("carContainer");
const searchBox = document.getElementById("searchBox");

function loadCars() {

    const cars = JSON.parse(localStorage.getItem("cars")) || [];

    if (cars.length === 0) {

        carContainer.innerHTML = `
            <h2 style="text-align:center;width:100%;">
                No cars available.
            </h2>
        `;

        return;
    }

    displayCars(cars);
}

function displayCars(cars) {

    carContainer.innerHTML = "";

    cars.forEach(car => {

        carContainer.innerHTML += `

        <div class="card">

            <img src="${car.image}" alt="${car.name}">

            <h3>${car.name}</h3>

            <p>${car.price}</p>

            <button onclick="viewDetails('${car.name}','${car.price}')">
                View Details
            </button>

        </div>

        `;

    });

}

function viewDetails(name, price) {

    alert(
        "Car Name : " + name +
        "\nPrice : " + price
    );

}

searchBox.addEventListener("keyup", function () {

    const value = this.value.toLowerCase();

    const cars = JSON.parse(localStorage.getItem("cars")) || [];

    const filtered = cars.filter(car =>
        car.name.toLowerCase().includes(value)
    );

    displayCars(filtered);

});

loadCars();
</script>

</body>
</html>
