<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Contact Us</title>

<link rel="stylesheet" href="style.css">

<style>

.contact{

padding:120px 8%;

}

.contact h1{

text-align:center;

margin-bottom:30px;

}

.form{

max-width:600px;

margin:auto;

background:#fff;

padding:30px;

border-radius:10px;

box-shadow:0 5px 15px rgba(0,0,0,.2);

}

.form input,
.form textarea{

width:100%;

padding:12px;

margin:12px 0;

border:1px solid #ccc;

border-radius:5px;

}

.form button{

width:100%;

padding:14px;

background:#ff3c00;

color:white;

border:none;

cursor:pointer;

font-size:18px;

border-radius:5px;

}

.form button:hover{

background:#111;

}

.info{

text-align:center;

margin-top:40px;

line-height:35px;

}

iframe{

width:100%;

height:350px;

margin-top:30px;

border:none;

}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo">
<h2>Car<span>Deal</span></h2>
</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="cars.html">Cars</a></li>

<li><a href="reviews.html">Reviews</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<section class="contact">

<h1>Contact Us</h1>

<div class="form">

<input
type="text"
id="name"
placeholder="Your Name">

<input
type="email"
id="email"
placeholder="Your Email">

<textarea
rows="6"
id="message"
placeholder="Your Message"></textarea>

<button onclick="sendMessage()">

Send Message

</button>

</div>

<div class="info">

<h3>CarDeal Showroom</h3>

<p>123 Main Road, Mumbai, India</p>

<p> 📞9106938507</p>

<p>✉️ support@cardeal.com</p>

</div>

<iframe
src="https://www.google.com/maps?q=Mumbai&output=embed">
</iframe>

</section>

<script>

function sendMessage(){

let name=document.getElementById("name").value;

let email=document.getElementById("email").value;

let message=document.getElementById("message").value;

if(name===""||email===""||message===""){

alert("Please fill all fields.");

return;

}

alert("Thank you! Your message has been sent.");

document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("message").value="";

}

</script>

</body>
</html>
